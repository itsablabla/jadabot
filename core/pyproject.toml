[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jadabot"
version = "0.1.0"
description = "Multi-bot platform: LangBot base, per-bot Pipali runtimes, central LLM manager, Mem0 memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["jadabot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
